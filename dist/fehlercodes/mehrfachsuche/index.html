<style>:root{color-scheme:dark;--bg:#15120f;--panel:#241d17;--line:#6c5540;--gold:#e9c48f;--text:#f5eee5;--muted:#c7b6a4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}main,header,footer{max-width:1100px;margin:auto;padding:24px clamp(16px,4vw,36px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}a{color:var(--gold)}.brand{text-decoration:none;font-weight:850;letter-spacing:.06em;color:#fff}h1{font:normal clamp(2rem,5vw,3.4rem)/1.15 Georgia,serif;max-width:850px;margin:28px 0 18px}p{color:var(--muted)}.eyebrow{font:700 .8rem monospace;color:var(--gold);letter-spacing:.12em}.box{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:clamp(16px,3vw,28px);margin:22px 0}.lang{display:flex;gap:6px}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:11px 15px;background:#35281c;color:var(--text)}button.primary{background:var(--gold);color:#20160e;font-weight:750;border-color:var(--gold)}button:disabled{opacity:.5;cursor:not-allowed}button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}select{display:block;width:100%;max-width:430px;margin:0 0 8px;background:#110e0c;color:var(--text);border:1px solid #9a7954;border-radius:8px;padding:11px 13px;font:inherit}select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}label{display:block;font-weight:750;margin-bottom:10px}textarea{width:100%;min-height:170px;resize:vertical;background:#110e0c;color:var(--text);border:1px solid #9a7954;border-radius:8px;padding:15px;font:15px/1.6 ui-monospace,monospace}textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.status{min-height:24px;color:var(--gold)}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:500px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.8rem;color:var(--gold)}td:first-child{font:700 1rem ui-monospace,monospace;color:var(--gold)}td small{display:block;color:var(--muted);margin-top:4px}.muted{font-size:.85rem;color:var(--muted)}.notice{border-left:3px solid var(--gold);padding:12px 16px;background:#35281c;border-radius:5px}footer{border-top:1px solid var(--line);color:var(--muted)}@media(max-width:600px){header{padding-top:16px}table{min-width:0}thead{display:none}tr{display:grid;padding:10px 0}td{display:block;padding:4px 0;border:0}td:last-child{border-bottom:1px solid var(--line);padding-bottom:12px}}</style></head><body>
<header><a class="brand" href="/">6006 PERFORMANCE</a><div class="lang" role="group" aria-label="Language / Sprache / Dil"><button type="button" data-lang="de" aria-pressed="true">DE</button><button type="button" data-lang="tr" aria-pressed="false">TR</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></header>
<main><p class="eyebrow">6006 / OBD-II / P · B · C · U</p><h1 data-i18n="heading"></h1><p data-i18n="sub"></p>
<section class="box"><label for="manufacturer" data-i18n="manufacturer"></label><select id="manufacturer"><option value=""></option></select><p class="muted" data-i18n="manufacturerHint"></p><label for="scan" data-i18n="input"></label><textarea id="scan" maxlength="100000" spellcheck="false" autocomplete="off"></textarea>
<div class="actions"><button class="primary" type="button" id="analyze" data-i18n="analyze"></button><button type="button" id="clear" data-i18n="reset"></button><button type="button" id="copy" data-i18n="copy" disabled></button><button type="button" id="download" data-i18n="download" disabled></button></div>
<p class="muted" data-i18n="limit"></p><p id="status" class="status" role="status" aria-live="polite"></p></section>
<section class="box" id="results" hidden><h2 id="count"></h2><div class="tablewrap"><table><thead><tr><th data-i18n="code"></th><th data-i18n="definition"></th><th data-i18n="source"></th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<p class="notice" data-i18n="privacy"></p><p class="muted" data-i18n="review"></p><p><a href="/fehlercodes/" data-i18n="back"></a></p></main>
<footer>© 6006 Performance · OBD-II · DE / TR / EN</footer><script>"use strict";
const extractCodes=function extractCodes(raw) {
  const seen = new Set();
  const matches = String(raw).toUpperCase().match(/(?:^|[^A-Z0-9])([PBCU][0-3][0-9A-F]{3})(?=$|[^A-Z0-9])/g) || [];
  for (const token of matches) {
    const code = token.match(/[PBCU][0-3][0-9A-F]{3}$/)?.[0];
    if (code) seen.add(code);
    if (seen.size >= 150) break;
  }
  return [...seen];
};
const safeCsv=function safeCsv(value) {
  let s=String(value??"").replace(/\r?\n/g," ");
  if (/^[\s]*[=+\-@]/.test(s)) s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
};
const labels={"de":{"heading":"Mehrere Fehlercodes auf einmal prüfen","sub":"OBD-Scantext einfügen. Doppelte P/B/C/U-Codes entfernen, vorhandene Definitionen zuordnen und eine Übersicht exportieren – lokal im Browser.","manufacturer":"Fahrzeughersteller (optional)","manufacturerAll":"Hersteller nicht ausgewählt","manufacturerHint":"Nur generische Definitionen oder Einträge des gewählten Herstellers werden angezeigt. Andere Marken werden nicht vermischt.","input":"OBD-Text oder Fehlercodes","placeholder":"Beispiel: P0299, P0401, U0100","analyze":"Codes auswerten","copy":"Übersicht kopieren","download":"CSV herunterladen","reset":"Leeren","found":"Eindeutige Codes","limit":"Maximal 150 unterschiedliche Codes pro Auswertung.","code":"Fehlercode","definition":"Vorhandene Definition","source":"Typ","open":"Im Katalog öffnen","generic":"Generisch","missing":"Keine Definition im Katalog","wait":"Katalog wird geladen…","error":"Katalog nicht erreichbar. Codes können trotzdem erkannt werden.","empty":"Bitte einen OBD-Text oder Fehlercodes einfügen.","none":"Keine gültigen P/B/C/U-Codes erkannt.","done":"Übersicht kopiert.","privacy":"Keine Fahrzeugdaten werden hochgeladen. Auswertung erfolgt in Ihrem Browser. Diagnosecodes ersetzen keine fahrzeugspezifische Prüfung.","back":"Zum Fehlercode-Katalog","review":"Hersteller-, ECU-, Freeze-Frame- und Live-Daten prüfen; ein DTC beweist keinen Bauteilschaden."},"tr":{"heading":"Birden fazla arıza kodunu birlikte incele","sub":"OBD tarama metnini yapıştır. Tekrarlanan P/B/C/U kodlarını ayıkla, katalogdaki açıklamaları eşleştir ve sonucu dışa aktar.","manufacturer":"Araç markası (isteğe bağlı)","manufacturerAll":"Marka seçilmedi","manufacturerHint":"Yalnızca genel tanımlar veya seçilen markaya ait tanımlar gösterilir. Başka markaların açıklamaları karıştırılmaz.","input":"OBD tarama metni veya arıza kodları","placeholder":"Örnek: P0299, P0401, U0100","analyze":"Kodları analiz et","copy":"Özeti kopyala","download":"CSV indir","reset":"Temizle","found":"Benzersiz kod","limit":"Bir analizde en fazla 150 farklı kod.","code":"Arıza kodu","definition":"Katalogdaki açıklama","source":"Tür","open":"Katalogda aç","generic":"Genel","missing":"Katalogda açıklama bulunamadı","wait":"Katalog yükleniyor…","error":"Kataloğa erişilemedi. Kodlar yine de ayıklanabilir.","empty":"OBD metni veya arıza kodlarını gir.","none":"Geçerli P/B/C/U kodu bulunamadı.","done":"Özet kopyalandı.","privacy":"Araç bilgileri sunucuya yüklenmez; analiz tarayıcında yapılır. Arıza kodu araç özelinde teşhisin yerini tutmaz.","back":"Arıza kodu kataloğuna dön","review":"Üretici, ECU, freeze-frame ve canlı verilerle doğrula; tek kod parça arızasını kanıtlamaz."},"en":{"heading":"Review multiple fault codes at once","sub":"Paste OBD scan text, deduplicate P/B/C/U codes, match available catalog definitions and export the results.","manufacturer":"Vehicle manufacturer (optional)","manufacturerAll":"No manufacturer selected","manufacturerHint":"Only generic definitions or definitions for the selected manufacturer are shown. Other makes are not mixed in.","input":"OBD scan text or fault codes","placeholder":"Example: P0299, P0401, U0100","analyze":"Analyze codes","copy":"Copy summary","download":"Download CSV","reset":"Clear","found":"Unique codes","limit":"Up to 150 unique codes per analysis.","code":"Fault code","definition":"Catalog definition","source":"Type","open":"Open in catalog","generic":"Generic","missing":"No catalog definition found","wait":"Loading catalog…","error":"Catalog unavailable. Codes can still be extracted.","empty":"Enter scan text or fault codes.","none":"No valid P/B/C/U codes found.","done":"Summary copied.","privacy":"No vehicle data is uploaded. Processing runs in your browser. Fault codes do not replace vehicle-specific diagnosis.","back":"Back to fault code catalog","review":"Verify manufacturer, ECU, freeze-frame and live data; a code alone does not prove a faulty part."}};
const $=id=>document.getElementById(id);
let language=/^tr/i.test(navigator.language)?"tr":/^en/i.test(navigator.language)?"en":"de";
let catalog=new Map(),catalogFailed=false,results=[];
function t(key){return labels[language][key];}
function translate(){document.documentElement.lang=language;document.title="6006 Performance — "+t("heading");document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});$("scan").placeholder=t("placeholder");$("manufacturer").options[0].textContent=t("manufacturerAll");document.querySelectorAll("[data-lang]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.lang===language)));if(results.length)render();else $("status").textContent=catalogFailed?t("error"):"";}
function chooseDescription(code){const rows=catalog.get(code)||[];const maker=$("manufacturer").value;const best=(maker&&rows.find(r=>r[1]===maker))||rows.find(r=>r[1]==="GENERIC");return best?{desc:best[2],source:best[1]}:{desc:t("missing"),source:"—"};}
function render(){const body=$("rows");body.replaceChildren();$("count").textContent=results.length+" "+t("found");for(const code of results){const item=chooseDescription(code),tr=document.createElement("tr"),a=document.createElement("a");a.href="/fehlercodes/?code="+encodeURIComponent(code);a.textContent=t("open");for(const value of [code,item.desc,item.source==="GENERIC"?t("generic"):item.source]){const td=document.createElement("td");td.textContent=value;tr.append(td);}const td=document.createElement("td");td.append(a);tr.append(td);body.append(tr);}$("results").hidden=!results.length;$("copy").disabled=$("download").disabled=!results.length;}
function analyze(){results=extractCodes($("scan").value);if(!$("scan").value.trim()){$("status").textContent=t("empty");}else if(!results.length){$("status").textContent=t("none");}else{$("status").textContent=results.length+" "+t("found")+(results.length===150?" · "+t("limit"):"");}render();}
function rowsForExport(){return results.map(code=>{const item=chooseDescription(code);return [code,item.source,item.desc,"https://6006coding.de/fehlercodes/?code="+code]});}
$("manufacturer").addEventListener("change",()=>{if(results.length)render();});
$("analyze").addEventListener("click",analyze);
$("scan").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")analyze();});
$("clear").addEventListener("click",()=>{$("scan").value="";results=[];$("status").textContent="";render();$("scan").focus();});
document.querySelectorAll("[data-lang]").forEach(el=>el.addEventListener("click",()=>{language=el.dataset.lang;translate();}));
$("download").addEventListener("click",()=>{if(!results.length)return;const lines=[["Code","Source","Description","Catalog URL"],...rowsForExport()].map(row=>row.map(safeCsv).join(","));const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="6006-dtc-report.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$("copy").addEventListener("click",async()=>{if(!results.length)return;const text=rowsForExport().map(row=>row[0]+" — "+row[2]+" ("+row[1]+")").join("\n")+"\n"+t("review");try{await navigator.clipboard.writeText(text);$("status").textContent=t("done");}catch(_){$("status").textContent=t("error");}});
translate();
fetch("/assets/6006-dtc-catalog.json",{cache:"force-cache"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(data=>{if(!Array.isArray(data.defs))throw Error("Invalid catalog");const makers=new Set();for(const row of data.defs){if(!Array.isArray(row)||row.length!==3||!(/^[PBCU][0-3][0-9A-F]{3}$/.test(row[0]))||typeof row[1]!=="string"||typeof row[2]!=="string")continue;if(row[1]!=="GENERIC")makers.add(row[1]);const group=catalog.get(row[0])||[];if(group.length<12)group.push(row);catalog.set(row[0],group);}const select=$("manufacturer");for(const maker of [...makers].sort((a,b)=>a.localeCompare(b,"de"))){const option=document.createElement("option");option.value=maker;option.textContent=maker;select.append(option);}if(results.length)render();}).catch(()=>{catalogFailed=true;$("status").textContent=t("error");});
</script></body></html>

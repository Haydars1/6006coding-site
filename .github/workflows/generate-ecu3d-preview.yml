name: Generate 6006 ECU 3D preview (branch only)
on:
  push:
    branches: [feat/ecu3d-prototype-20261011]
    paths:
      - 'scripts/build_ecu3d.py'
      - 'dist/ecu3d/ecu3d-viewer.js'
      - 'dist/ecu3d/index.html'
      - '.github/workflows/generate-ecu3d-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build_model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout separate prototype branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source model generator dependencies
        run: python -m pip install --quiet trimesh==4.11.1 numpy==2.3.5
      - name: Build physical 3-port 3D GLB
        run: python scripts/build_ecu3d.py
      - name: Verify model and standalone viewer
        run: |
          node --check dist/ecu3d/ecu3d-viewer.js
          test -s dist/ecu3d/ecu-6006-3port.glb
          python - <<'PY'
          import trimesh
          from pathlib import Path
          path=Path('dist/ecu3d/ecu-6006-3port.glb')
          model=trimesh.load(path,force='scene')
          groups={name.split('_')[0] for name in model.geometry}
          assert {'BASE','CONNECTORS','PCB','LID'} <= groups
          assert path.stat().st_size < 3_000_000
          print('PASS: physically independent ECU meshes',len(model.geometry),'GLB bytes',path.stat().st_size)
          PY
      - name: Commit generated model to review branch only
        shell: bash
        run: |
          git config user.name "6006 ECU 3D Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ecu3d/ecu-6006-3port.glb
          if ! git diff --cached --quiet; then
            git commit -m "assets(ecu3d): generate physical three-connector GLB for review"
            git pull --rebase origin feat/ecu3d-prototype-20261011
            git push origin HEAD:feat/ecu3d-prototype-20261011
          fi
